<!DOCTYPE html>
<html>

<head>

    <title>Online Product Order</title>

    <style>

        body {
            font-family: Arial;
            background-color: #eeeeee;
        }

        #mainTitle {
            text-align: center;
            color: darkred;
        }

        #orderBox {
            width: 450px;
            border: 2px solid black;
            margin: 20px auto;
            padding: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .bill {
            width: 450px;
            border: 2px solid green;
            margin: 20px auto;
            padding: 15px;
        }

        #orderButton {
            padding: 10px;
            background: lightblue;
        }

    </style>

</head>

<body>

<h1 id="mainTitle">Online Product Order</h1>

<div id="orderBox">

    <div class="field">

        <label for="customer">Customer Name:</label>

        <input type="text" id="customer">

    </div>

    <div class="field">

        <label for="product">Select Product:</label>

        <select id="product">

            <option value="">Select Product</option>

            <option value="Laptop">Laptop - Rs. 50000</option>

            <option value="Mobile">Mobile - Rs. 20000</option>

            <option value="Keyboard">Keyboard - Rs. 1500</option>

        </select>

    </div>

    <div class="field">

        <label for="quantity">Quantity:</label>

        <input type="number" id="quantity" min="1">

    </div>

    <button id="orderButton" onclick="calculateBill()">

        Generate Bill

    </button>

</div>

<div id="billBox" class="bill">

    Bill will appear here.

</div>

<script>

function calculateBill() {

    // Read Input
    var customer =
        document.getElementById("customer").value;

    var product =
        document.getElementById("product").value;

    var quantity =
        document.getElementById("quantity").value;


    // Validate Customer
    if (customer == "") {
        alert("Enter Customer Name");
        return;
    }


    // Validate Product
    if (product == "") {
        alert("Select a Product");
        return;
    }


    // Validate Quantity
    if (quantity == "" || isNaN(quantity) || Number(quantity) <= 0) {
        alert("Enter a valid quantity greater than 0");
        return;
    }

    quantity = Number(quantity);


    // Determine Price
    var price = 0;

    if (product == "Laptop") {
        price = 50000;
    }

    if (product == "Mobile") {
        price = 20000;
    }

    if (product == "Keyboard") {
        price = 1500;
    }


    // Calculate Total
    var total = price * quantity;


    // Ask Customer Type
    var customerType =
        prompt("Enter Customer Type: Regular or Premium");

    if (customerType == null || customerType == "") {
        alert("Customer Type is required");
        return;
    }

    if (customerType != "Regular" && customerType != "Premium") {
        alert("Enter only Regular or Premium");
        return;
    }


    // Ask Confirmation
    var order =
        confirm("Do you want to place this order?");

    if (order == false) {
        alert("Order cancelled");
        return;
    }


    // Generate Bill
    document.getElementById("billBox").innerHTML =
        "<h2>Order Bill</h2>" +
        "Customer: " + customer +
        "<br>Product: " + product +
        "<br>Price: Rs. " + price +
        "<br>Quantity: " + quantity +
        "<br>Total Amount: Rs. " + total +
        "<br>Customer Type: " + customerType;


    // Success Alert
    alert("Order placed successfully");

}

</script>

</body>

</html>
